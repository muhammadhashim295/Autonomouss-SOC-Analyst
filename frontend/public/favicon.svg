<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Shield Contour -->
  <path d="M32 5 L53 13 C53 36 43 51 32 59 C21 51 11 36 11 13 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Subtle Cyber Reticle Axes -->
  <path d="M32 12 L32 52" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 2" />
  <path d="M17 28 L47 28" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 2" />

  <!-- Autonomous AI Radar Rings -->
  <circle cx="32" cy="28" r="11" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="32" cy="28" r="6.5" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Central Intelligence Core Diamond -->
  <polygon points="32,22 37,28 32,34 27,28" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="32" cy="28" r="1.8" fill="#ffffff" />

  <!-- Autonomous Defense Lower Chevron -->
  <polyline points="23,42 32,48 41,42" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
